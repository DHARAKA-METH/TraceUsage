#spring.datasource.username=neondb_owner
#spring.datasource.password=npg_DNaxc63XQOSl

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=30d

traceusage.ingestion.mode=kafka
traceusage.kafka.topics.endpoint-events=traceusage.endpoint-events
traceusage.kafka.topics.field-events=traceusage.field-events
traceusage.kafka.topics.endpoint-events-dlt=traceusage.endpoint-events.dlt
traceusage.kafka.topics.field-events-dlt=traceusage.field-events.dlt

# Telemetry storage / retention policy.
# HYBRID keeps recent raw rows for troubleshooting and long-term hourly aggregates for analytics.
# RAW_ONLY disables raw-event deletion (aggregates are still maintained).
traceusage.telemetry.retention.enabled=true
traceusage.telemetry.retention.storage-mode=HYBRID
traceusage.telemetry.retention.raw-days=14
traceusage.telemetry.retention.aggregate-days=730
# Must stay larger than the Kafka topic retention window so redelivered events cannot be double counted.
traceusage.telemetry.retention.deduplication-days=30
traceusage.telemetry.retention.cleanup-interval-ms=3600000
traceusage.telemetry.retention.initial-delay-ms=600000

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=traceusage-processors
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=TraceUsage



